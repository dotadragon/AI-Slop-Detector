services:
  frontend:
    restart: always
  backend:
    restart: always
    deploy:
      resources:
        limits:
          memory: 2g
  worker:
    restart: always
    deploy:
      resources:
        limits:
          memory: 4g
  redis:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512m
  nginx:
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

volumes:
  certbot-www:
  letsencrypt:
